services:

  db:
    image: postgres:17
    container_name: postgres_db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8-alpine
    container_name: redis

    ports:
      - "6379:6379"


  web:
    build: .
    container_name: django_app
    user: "${UID}:${GID}"
    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - db
      - redis

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}


  worker:
    build: .
    command: celery -A config worker --loglevel=info
    user: "${UID}:${GID}"
    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - db
      - redis


volumes:
  postgres_data:

