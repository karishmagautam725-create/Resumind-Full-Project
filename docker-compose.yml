services:
   db:
      image: postgres:17
      container_name: postgres_db
      environment:
         POSTGRES_DB: resume_checker_db
         POSTGRES_USER: resume_user
         POSTGRES_PASSWORD: 2004
      ports:
         - "5432:5432"

      volumes:
         - postgres_data:/var/lib/postgresql/data
   redis:
      image: redis:8-alpine
      container_name: redis
      ports:
         - "6379:6379"
   web:
      build: .
      container_name: django_app

      command: python manage.py runserver 0.0.0.0:8000

      ports:
        - "8000:8000"

      env_file:
          - .env

      depends_on:
        - db
        - redis
      environment:
         DB_NAME: resume_checker_db
         DB_USER: resume_user
         DB_PASSWORD: 2004
         DB_HOST: db
         DB_PORT: 5432
   worker:
       build: .
       command: celery -A config worker --loglevel=info
       env_file:
          - .env
       depends_on:
         - db
         - redis

volumes:
  postgres_data:

